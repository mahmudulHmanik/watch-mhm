<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DhakaFlix Browser</title>
  <link rel="icon" href="data:,">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('dfTheme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light') } catch (e) { }</script>
  <link rel="stylesheet" href="/css/app.css">
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" />
      </symbol>
      <symbol id="i-film" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M7 3v18M17 3v18M3 8h4M3 12h4M3 16h4M17 8h4M17 12h4M17 16h4" />
      </symbol>
      <symbol id="i-tv" viewBox="0 0 24 24">
        <rect x="2" y="7" width="20" height="14" rx="2" />
        <path d="M17 2l-5 5-5-5" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="M21 21l-4.3-4.3" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M7 4l13 8-13 8z" fill="currentColor" />
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor" />
      </symbol>
      <symbol id="i-prev" viewBox="0 0 24 24">
        <path d="M19 20L9 12l10-8zM5 4v16" />
      </symbol>
      <symbol id="i-next" viewBox="0 0 24 24">
        <path d="M5 4l10 8-10 8zM19 4v16" />
      </symbol>
      <symbol id="i-vol" viewBox="0 0 24 24">
        <path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a9.5 9.5 0 0 1 0 14" />
      </symbol>
      <symbol id="i-mute" viewBox="0 0 24 24">
        <path d="M11 5L6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6" />
      </symbol>
      <symbol id="i-full" viewBox="0 0 24 24">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3" />
      </symbol>
      <symbol id="i-ext" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
      </symbol>
      <symbol id="i-dl" viewBox="0 0 24 24">
        <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" />
      </symbol>
      <symbol id="i-cc" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="M7 15h4M13 15h4M7 11h2M12 11h5" />
      </symbol>
      <symbol id="i-audio" viewBox="0 0 24 24">
        <path d="M3 14v-4M8 18V6M13 21V3M18 17V7M22 14v-4" />
      </symbol>
    </defs>
  </svg>
  <button class="menu" id="menu" type="button" aria-label="Open menu"><svg class="ic">
      <use href="#i-menu" />
    </svg></button>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="nav" id="nav">
    <a class="brand" href="#"><span class="mark">D</span><span>Dhaka<em>Flix</em></span></a>
    <label class="search"><svg class="ic">
        <use href="#i-search" />
      </svg><input id="q" type="search" placeholder="Search titles" aria-label="Search titles"
        autocomplete="off"></label>
    <nav aria-label="Library"><button class="ni on" data-t="" type="button"><svg class="ic">
          <use href="#i-home" />
        </svg><span class="lbl">Home</span></button><button class="ni" data-t="movie" type="button"><svg class="ic">
          <use href="#i-film" />
        </svg><span class="lbl">Movies</span></button><button class="ni" data-t="series" type="button"><svg class="ic">
          <use href="#i-tv" />
        </svg><span class="lbl">Series</span></button></nav>
    <div class="nh">Collections</div>
    <div class="secs" id="secs"></div>
    <div class="scan" id="scan" hidden></div>
    <div class="foot"><button class="ni" id="rescan" type="button"><svg class="ic">
          <use href="#i-refresh" />
        </svg><span class="lbl">Rescan library</span></button><button class="ni" id="theme" type="button"></button>
    </div>
  </aside>
  <div>
    <main id="home">
      <h1 id="ht">Recently added</h1>
      <p class="meta" id="count"></p>
      <div class="tools">
        <div class="chips" id="years" role="group" aria-label="Filter by year"></div><label class="sort">Sort <select
            id="sort">
            <option value="">Recently added</option>
            <option value="year">Year, newest first</option>
            <option value="yearAsc">Year, oldest first</option>
            <option value="title">Title A to Z</option>
          </select></label>
      </div>
      <div id="grid"></div>
      <div id="empty" hidden></div><button id="more" type="button" hidden>Show more</button>
    </main>
    <section id="wv" hidden>
      <div class="wl">
        <div class="wm">
          <div id="pl" hidden>
            <div id="stage"><video id="v" controls></video>
              <div class="seekrow" id="seekrow" hidden><button id="pp" type="button" aria-label="Play or pause"><svg
                    class="ic">
                    <use href="#i-pause" />
                  </svg></button><input id="seek" type="range" min="0" max="0" step="1" aria-label="Seek"><span
                  id="tm"></span><button id="mu" type="button" aria-label="Mute"><svg class="ic">
                    <use href="#i-vol" />
                  </svg></button><input id="vol" type="range" min="0" max="1" step="0.05" value="1"
                  aria-label="Volume"><button id="fs" type="button" aria-label="Fullscreen"><svg class="ic">
                    <use href="#i-full" />
                  </svg></button></div>
            </div>
            <p id="msg"></p>
            <div class="ctl"><label><svg class="ic">
                  <use href="#i-audio" />
                </svg>Audio <select id="aud"></select></label><label><svg class="ic">
                  <use href="#i-cc" />
                </svg>Subtitles <select id="sub"></select></label><label><input type="checkbox" id="cv"> Convert
                video</label></div>
          </div>
          <h2 id="dt"></h2>
          <div id="ep"></div>
          <div id="dtags"></div>
          <div class="act"><button id="prev" class="b" type="button"><svg class="ic">
                <use href="#i-prev" />
              </svg><span>Previous</span></button><button id="next" class="b p" type="button"><span>Next</span><svg
                class="ic">
                <use href="#i-next" />
              </svg></button><label class="auto"><input type="checkbox" id="auto" checked> Autoplay next</label></div>
          <div class="act"><button id="ovlc" class="b" type="button"><svg class="ic">
                <use href="#i-ext" />
              </svg><span>Open in VLC</span></button><button id="ompv" class="b" type="button"><svg class="ic">
                <use href="#i-ext" />
              </svg><span>Open in mpv</span></button><a id="m3u" class="b"><svg class="ic">
                <use href="#i-list" />
              </svg><span>Playlist (.m3u)</span></a><a id="dl" class="b"><svg class="ic">
                <use href="#i-dl" />
              </svg><span>Download</span></a><button id="cp" class="b" type="button"><svg class="ic">
                <use href="#i-link" />
              </svg><span>Copy link</span></button></div>
        </div>
        <aside class="side">
          <div id="plbox" hidden>
            <div class="pH"><b>Playlist</b><span id="plc"></span></div>
            <div id="plist"></div>
          </div>
          <h3>More like this</h3>
          <div id="rel"></div>
        </aside>
      </div>
    </section>
  </div>
  <script src="/js/app.js"></script>
</body>

</html>
